<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JitterFX - TOLGRIM</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#bb86fc">
    <link rel="icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="exportModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; color: white; font-family: monospace;">
        <h2 id="exportModalTitle" style="color: var(--accent-color); margin-bottom: 20px;">Codificando...</h2>
        <div style="width: 80%; max-width: 400px; height: 10px; background: #333; border-radius: 5px; overflow: hidden;">
            <div id="exportModalProgress" style="width: 0%; height: 100%; background: var(--accent-color); transition: width 0.2s;"></div>
        </div>
        <p id="exportModalText" style="margin-top: 15px;">0%</p>
        <p style="font-size: 0.8em; opacity: 0.6; margin-top: 30px;">Por favor, no cierres esta pestaña ni apagues la pantalla.</p>
    </div>
    <div class="container">
        <aside class="sidebar" id="sidebarElement">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2>JitterFX</h2>
                <label class="theme-switch" title="Tema Panel">
                    <input type="checkbox" id="themeToggleSidebar">
                    <span class="slider round">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    </span>
                </label>
            </div>
            
            <div class="section-card">
                <div class="section-title">🖼️ 1. Entrada</div>
                <div class="control-group">
                    <label>Imagen (PNG/JPG/WEBP)</label>
                <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp">
                <div id="imageInfo" style="font-size: 0.85em; opacity: 0.8; margin-top: 2px; display: none; line-height: 1.4;"></div>
            </div>
            <div class="control-group">
                    <label>Color de Fondo (Matte) <span title="El color visible debajo de imágenes con partes transparentes (PNG/WEBP)." style="cursor:help;opacity:0.6"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-left: 2px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></span></label>
                <div style="display: flex; gap: 5px;">
                    <input type="color" id="bgColorPicker" value="#000000" style="width: 40px; padding: 0; cursor: pointer;" disabled>
                    <select id="bgPreset" style="flex: 1;" disabled>
                        <option value="transparent">Transparente</option>
                        <option value="#000000">Twitter Oscuro</option>
                        <option value="#15202b">Twitter Dim</option>
                        <option value="#ffffff">Twitter Claro</option>
                        <option value="custom">Personalizado...</option>
                    </select>
                </div>
            </div>
            
            </div>

            <div class="section-card">
                <div class="section-title">🌪️ 2. Motor Matemático</div>
                <div class="control-group">
                    <label>Presets Mágicos</label>
                <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                    <button id="presetPencil" class="toggle-btn" disabled style="flex: 1; padding: 4px; font-size: 0.85em;" title="Estilo de dibujo a lápiz tembloroso">🖋️ Lápiz</button>
                    <button id="presetVHS" class="toggle-btn" disabled style="flex: 1; padding: 4px; font-size: 0.85em;" title="Estilo cámara antigua / estática">📺 VHS</button>
                    <button id="presetWater" class="toggle-btn" disabled style="flex: 1; padding: 4px; font-size: 0.85em;" title="Ondulaciones de agua suaves">🌊 Olas</button>
                    <button id="presetChaos" class="toggle-btn" disabled style="flex: 1; padding: 4px; font-size: 0.85em;" title="Vibración extrema en bloques">🌪️ Caos</button>
                </div>
            </div>

            <div class="control-group">
                <label>Tipo de Jitter <span title="El estilo matemático de vibración. El Ruido Perlin (Value Noise) es más orgánico, los demás son más robóticos o cuadriculados." style="cursor:help;opacity:0.6"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-left: 2px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></span></label>
                <select id="typeInput" disabled>
                    <option value="0">Global Shift</option>
                    <option value="1">Chunky Jitter (Bloques)</option>
                    <option value="2">Static / Fuzzy</option>
                    <option value="3">Mesh Bend (Ondulación)</option>
                    <option value="4">Smooth Chunky (Value Noise)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Intensidad <span title="Fuerza del temblor. Valores altos rompen la imagen." style="cursor:help;opacity:0.6"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-left: 2px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></span>: <span id="amountVal">0.005</span></label>
                <input type="range" id="amountInput" min="0" max="0.05" step="0.001" value="0.005" disabled>
            </div>

            <div class="control-group">
                <label>Velocidad (FPS) <span title="Rapidez del temblor." style="cursor:help;opacity:0.6"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-left: 2px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></span>: <span id="speedVal">8</span></label>
                <input type="range" id="speedInput" min="1" max="30" step="1" value="8" disabled>
            </div>

            <div class="control-group">
                <label>Frames Únicos <span title="Cuántos fotogramas componen el bucle antes de repetirse." style="cursor:help;opacity:0.6"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-left: 2px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></span>: <span id="framesVal">3</span></label>
                <input type="range" id="framesInput" min="2" max="24" step="1" value="3" disabled>
            </div>

            <div class="control-group">
                <label>Tamaño Bloque <span title="Tamaño del bloque de ruido matemático." style="cursor:help;opacity:0.6"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-left: 2px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></span>: <span id="blockVal">20</span></label>
                <input type="range" id="blockInput" min="1" max="100" step="1" value="20" disabled>
            </div>

            <div class="control-group" style="flex-direction: row; align-items: center; margin-bottom: 10px;">
                <input type="checkbox" id="pingpongInput" style="width: auto; cursor: pointer;" disabled>
                <label for="pingpongInput" style="margin-left: 5px; cursor: pointer;">Bucle Ping-Pong <span title="La animación rebota hacia adelante y hacia atrás. Útil para hacer bucles perfectos (seamless) que no saltan de golpe." style="cursor:help;opacity:0.6"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-left: 2px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></span></label>
            </div>
            
            </div>

            

            
            <div class="section-card">
                <div class="section-title">🖌️ 3. Aislamiento Táctico</div>
                <div class="control-group">
                <label>Máscara de Aislamiento (Pincel) <span title="Dibuja sobre el lienzo para elegir con precisión qué zonas deben temblar y cuáles quedarse congeladas." style="cursor:help;opacity:0.6"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-left: 2px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></span></label>
                <div style="display: flex; gap: 5px; margin-bottom: 5px;">
                    <button id="brushEnableBtn" class="toggle-btn" style="flex: 1; padding: 6px;" disabled>Activar Pincel</button>
                    <button id="brushViewBtn" class="toggle-btn" style="flex: 1; padding: 6px;" disabled>Ver Máscara</button>
                </div>
                
                <div id="brushControlsDiv" style="display: none; flex-direction: column; gap: 5px;">
                    <div style="display: flex; gap: 5px;">
                        <button id="brushModeAddBtn" class="toggle-btn active" style="flex: 1; padding: 4px;">+ Jitter</button>
                        <button id="brushModeSubBtn" class="toggle-btn" style="flex: 1; padding: 4px;">- Estático</button>
                    </div>
                    
                    <div style="display: flex; align-items: center; gap: 5px; font-size: 0.8em;">
                        <span>Tamaño:</span>
                        <input type="range" id="brushSizeInput" min="10" max="400" value="50" style="flex: 2; width: auto;">
                    </div>
                    
                    <div style="display: flex; align-items: center; gap: 5px; font-size: 0.8em;">
                        <span>Dureza:</span>
                        <input type="range" id="brushHardnessInput" min="0" max="100" value="50" style="flex: 2; width: auto;">
                    </div>
                    
                    <div style="display: flex; gap: 5px; margin-top: 2px;">
                        <button id="maskClearBtn" style="flex: 1; background: #555; padding: 4px; font-size: 0.8em;">Borrar Todo</button>
                        <button id="maskFillBtn" style="flex: 1; background: #555; padding: 4px; font-size: 0.8em;">Llenar Todo</button>
                    </div>
                </div>
            </div>
            </div>

            <div class="section-card">
                <div class="section-title">🛡️ 4. Firma y Protección</div>
                <div class="control-group">
                <label>Marca de Agua Táctica <span title="Protege tu obra inyectando texto incrustado. Usa los controles para elegir la esquina, opacidad y colores tipográficos." style="cursor:help;opacity:0.6"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-left: 2px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></span></label>
                <input type="text" id="watermarkInput" placeholder="@usuario o Firma" disabled style="margin-bottom: 5px;">
                
                <div style="display: flex; gap: 5px; margin-bottom: 5px;">
                    <select id="wmPos" style="flex: 1; padding: 4px;" disabled>
                        <option value="br">Abajo Derecha</option>
                        <option value="bl">Abajo Izquierda</option>
                        <option value="tr">Arriba Derecha</option>
                        <option value="tl">Arriba Izquierda</option>
                        <option value="c">Centro</option>
                    </select>
                    <input type="color" id="wmColor" value="#ffffff" title="Color de Texto" disabled style="width: 35px; padding: 0; cursor: pointer;">
                    <input type="color" id="wmBorderColor" value="#000000" title="Color de Borde" disabled style="width: 35px; padding: 0; cursor: pointer;">
                </div>
                
                <div style="display: flex; gap: 5px; align-items: center; font-size: 0.8em; flex-wrap: wrap; justify-content: space-between;">
                    <div style="display: flex; gap: 2px; flex: 1; min-width: 50px;">
                        <button id="wmBold" class="toggle-btn" disabled style="padding: 4px; flex: 1;">B</button>
                        <button id="wmItalic" class="toggle-btn" disabled style="padding: 4px; flex: 1; font-style: italic;">I</button>
                    </div>
                    
                    <div style="display: flex; align-items: center; flex: 2; min-width: 90px;">
                        <span style="margin-right: 5px;" title="Grosor Borde">Brd:</span>
                        <input type="range" id="wmBorderWidth" min="0" max="10" value="4" disabled style="width: 100%;">
                    </div>
                    
                    <div style="display: flex; align-items: center; flex: 2; min-width: 90px;">
                        <span style="margin-right: 5px;" title="Opacidad">Opc:</span>
                        <input type="range" id="wmOpacity" min="0.1" max="1" step="0.1" value="0.8" disabled style="width: 100%;">
                    </div>
                </div>
            </div>
            </div>
<div class="section-card" style="margin-bottom: 0;">
                <div class="section-title" style="color: var(--accent-color);">💾 5. Exportación</div>
                <div class="control-group">
                    <label>Resolución de Salida <span title="Escala la imagen antes de codificar el video. Evita colapsos de memoria RAM en lienzos gigantes (4K+) y permite sortear los límites de tamaño de Twitter." style="cursor:help;opacity:0.6"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-left: 2px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></span></label>
                <select id="resolutionInput" disabled>
                    <option value="original">Original</option>
                    <option value="1080">Max 1080p (Recomendado)</option>
                    <option value="720">Max 720p</option>
                    <option value="480">Max 480p</option>
                </select>
            </div>

            <div id="exportEstimate" style="font-size: 0.85em; opacity: 0.8; text-align: center; margin-bottom: 8px; color: var(--accent-color);"></div>

            <div class="control-group" style="flex-direction: row; gap: 10px;">
                <button id="exportBtn" disabled style="flex: 1;">Exportar GIF</button>
                <button id="exportWebmBtn" disabled style="flex: 1; background: #03dac6;">Exportar Video</button>
            </div>
            
            </div>
            
            <div id="status">Esperando imagen...</div>
        </aside>
        
        <main class="preview" id="dropZone">
            <label class="theme-switch" title="Tema Fondo" style="position: absolute; top: 15px; right: 15px; z-index: 10;">
                <input type="checkbox" id="themeTogglePreview">
                <span class="slider round">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </span>
            </label>
            
            <div id="emptyState" class="empty-state">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <h3 style="margin: 10px 0 5px 0;">Sube una imagen</h3>
                <p style="margin: 0; font-size: 0.9em;">Arrastra tu archivo aquí</p>
            </div>
            <canvas id="canvas"></canvas>
        </main>
    </div>
    
    <script src="gif.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
