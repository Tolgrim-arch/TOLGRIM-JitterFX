<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JitterFX - TOLGRIM</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#bb86fc">
    <link rel="icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="exportModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; color: white; font-family: monospace;">
        <h2 id="exportModalTitle" data-i18n="modal_title" style="color: var(--accent-color); margin-bottom: 20px;">Codificando...</h2>
        <div style="width: 80%; max-width: 400px; height: 10px; background: #333; border-radius: 5px; overflow: hidden;">
            <div id="exportModalProgress" style="width: 0%; height: 100%; background: var(--accent-color); transition: width 0.2s;"></div>
        </div>
        <p id="exportModalText" style="margin-top: 15px;">0%</p>
        <p data-i18n="modal_warn" style="font-size: 0.8em; opacity: 0.6; margin-top: 30px;">Por favor, no cierres esta pestaña ni apagues la pantalla.</p>
    </div>
    <div class="container">
        <aside class="sidebar" id="sidebarElement">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2>JitterFX</h2>

                <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
<select id="langSelect" style="padding: 2px 5px; font-size: 0.8em; border-radius: 4px; background: rgba(0,0,0,0.5); color: white; border: 1px solid var(--accent-color);">
                    <option value="en">EN</option>
                    <option value="es">ES</option>
                    <option value="zh">ZH</option>
                    <option value="ja">JA</option>
                    <option value="ko">KO</option>
                    <option value="fr">FR</option>
                    <option value="de">DE</option>
                    <option value="pt">PT</option>
                </select>

                
        
<label class="theme-switch" data-i18n-tip-only="theme_panel_tip" title="Tema Panel">
                    <input type="checkbox" id="themeToggleSidebar">
                    <span class="slider round">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    </span>
                </label>
            </div>
</div>
            
            <div class="section-card">
                <div class="section-title" data-i18n="s1_title">🖼️ 1. Entrada</div>
                <div class="control-group">
                    <label data-i18n="s1_image">Imagen (PNG/JPG/WEBP)</label>
                <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp">
                <div id="imageInfo" style="font-size: 0.85em; opacity: 0.8; margin-top: 2px; display: none; line-height: 1.4;"></div>
            </div>
            <div class="control-group">
                    <label data-i18n="s1_matte" data-i18n-tip="s1_matte_tip">Color de Fondo (Matte) <span title="The visible color underneath images with transparent parts (PNG/WEBP)." style="cursor:help;opacity:0.6"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-left: 2px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></span></label>
                <div style="display: flex; gap: 5px;">
                    <input type="color" id="bgColorPicker" value="#000000" style="width: 40px; padding: 0; cursor: pointer;" disabled>
                    <select id="bgPreset" style="flex: 1;" disabled>
                        <option value="transparent" data-i18n="bg_trans">Transparente</option>
                        <option value="#000000" data-i18n="bg_dark">Twitter Oscuro</option>
                        <option value="#15202b" data-i18n="bg_dim">Twitter Dim</option>
                        <option value="#ffffff" data-i18n="bg_light">Twitter Claro</option>
                        <option value="custom" data-i18n="bg_custom">Personalizado...</option>
                    </select>
                </div>
            </div>
            
            </div>

            <div class="section-card">
                <div class="section-title" data-i18n="s2_title">🌪️ 2. Motor Matemático</div>
                <div class="control-group">
                    <label data-i18n="s2_presets">Presets Mágicos</label>
                <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                    <button id="presetPencil" class="toggle-btn" disabled style="flex: 1; padding: 4px; font-size: 0.85em;" data-i18n="preset_pencil" data-i18n-tip-only="preset_pencil_tip" title="Estilo de dibujo a lápiz tembloroso">🖋️ Lápiz</button>
                    <button id="presetVHS" class="toggle-btn" disabled style="flex: 1; padding: 4px; font-size: 0.85em;" data-i18n="preset_vhs" data-i18n-tip-only="preset_vhs_tip" title="Estilo cámara antigua / estática">📺 VHS</button>
                    <button id="presetWater" class="toggle-btn" disabled style="flex: 1; padding: 4px; font-size: 0.85em;" data-i18n="preset_water" data-i18n-tip-only="preset_water_tip" title="Ondulaciones de agua suaves">🌊 Olas</button>
                    <button id="presetChaos" class="toggle-btn" disabled style="flex: 1; padding: 4px; font-size: 0.85em;" data-i18n="preset_chaos" data-i18n-tip-only="preset_chaos_tip" title="Vibración extrema en bloques">🌪️ Caos</button>
                </div>
            </div>

            <div class="control-group">
                <label data-i18n="s2_type">Tipo de Jitter <span title="El estilo matemático de vibración. El Ruido Perlin (Value Noise) es más orgánico, los demás son más robóticos o cuadriculados." style="cursor:help;opacity:0.6"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-left: 2px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></span></label>
                <select id="typeInput" disabled>
                    <option value="0">Global Shift</option>
                    <option value="1">Chunky Jitter (Bloques)</option>
                    <option value="2">Static / Fuzzy</option>
                    <option value="3">Mesh Bend (Ondulación)</option>
                    <option value="4">Smooth Chunky (Value Noise)</option>
                </select>
            </div>

            <div class="control-group">
                <label data-i18n="s2_intensity" data-i18n-tip="s2_intensity_tip">Intensidad <span title="Fuerza del temblor. Valores altos rompen la imagen." style="cursor:help;opacity:0.6"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-left: 2px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></span>: <span id="amountVal">0.005</span></label>
                <input type="range" id="amountInput" min="0" max="0.05" step="0.001" value="0.005" disabled>
            </div>

            <div class="control-group">
                <label>Velocidad (FPS) <span title="Rapidez del temblor." style="cursor:help;opacity:0.6"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-left: 2px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></span>: <span id="speedVal">8</span></label>
                <input type="range" id="speedInput" min="1" max="30" step="1" value="8" disabled>
            </div>

            <div class="control-group">
                <label data-i18n="s2_frames" data-i18n-tip="s2_frames_tip">Frames Únicos <span title="Cuántos fotogramas componen el bucle antes de repetirse." style="cursor:help;opacity:0.6"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-left: 2px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></span>: <span id="framesVal">10</span></label>
                <input type="range" id="framesInput" min="2" max="24" step="1" value="3" disabled>
            </div>

            <div class="control-group">
                <label data-i18n="s2_block" data-i18n-tip="s2_block_tip">Tamaño Bloque <span title="Size of the mathematical noise block." style="cursor:help;opacity:0.6"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-left: 2px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></span>: <span id="blockVal">20</span></label>
                <input type="range" id="blockInput" min="1" max="100" step="1" value="20" disabled>
            </div>

            <div class="control-group" style="flex-direction: row; align-items: center; margin-bottom: 10px;">
                <input type="checkbox" id="pingpongInput" style="width: auto; cursor: pointer;" disabled>
                <label for="pingpongInput" data-i18n="s2_pingpong" data-i18n-tip="s2_pingpong_tip" style="margin-left: 5px; cursor: pointer;">Bucle Ping-Pong <span title="The animation bounces forward and backward. Useful for seamless loops without sudden jumps." style="cursor:help;opacity:0.6"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-left: 2px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></span></label>
            </div>
            
            </div>

            

            
            <div class="section-card">
                <div class="section-title" data-i18n="s3_title">🖌️ 3. Aislamiento Táctico</div>
                <div class="control-group">
                <label data-i18n="s3_mask" data-i18n-tip="s3_mask_tip">Máscara de Aislamiento (Pincel) <span title="Draw on the canvas to precisely choose which areas should jitter and which should remain frozen." style="cursor:help;opacity:0.6"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-left: 2px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></span></label>
                <div style="display: flex; gap: 5px; margin-bottom: 5px;">
                    <button id="brushEnableBtn" class="toggle-btn" style="flex: 1; padding: 6px;" disabled data-i18n="btn_brush_enable">Activar Pincel</button>
                    <button id="brushViewBtn" class="toggle-btn" style="flex: 1; padding: 6px;" disabled data-i18n="btn_brush_view">Ver Máscara</button>
                </div>
                
                <div id="brushControlsDiv" style="display: none; flex-direction: column; gap: 5px;">
                    <div style="display: flex; gap: 5px;">
                        <button id="brushModeAddBtn" class="toggle-btn active" style="flex: 1; padding: 4px;" data-i18n="btn_add">+ Jitter</button>
                        <button id="brushModeSubBtn" class="toggle-btn" style="flex: 1; padding: 4px;" data-i18n="btn_sub">- Estático</button>
                    </div>
                    
                    <div style="display: flex; align-items: center; gap: 5px; font-size: 0.8em;">
                        <span>Tamaño:</span>
                        <input type="range" id="brushSizeInput" min="10" max="400" value="50" style="flex: 2; width: auto;">
                    </div>
                    
                    <div style="display: flex; align-items: center; gap: 5px; font-size: 0.8em;">
                        <span>Dureza:</span>
                        <input type="range" id="brushHardnessInput" min="0" max="100" value="50" style="flex: 2; width: auto;">
                    </div>
                    
                    <div style="display: flex; gap: 5px; margin-top: 2px;">
                        <button id="maskClearBtn" style="flex: 1; background: #555; padding: 4px; font-size: 0.8em;" data-i18n="btn_clear">Borrar Todo</button>
                        <button id="maskFillBtn" style="flex: 1; background: #555; padding: 4px; font-size: 0.8em;" data-i18n="btn_fill">Llenar Todo</button>
                    </div>
                </div>
            </div>
            </div>

            <div class="section-card">
                <div class="section-title" data-i18n="s4_title">🛡️ 4. Firma y Protección</div>
                <div class="control-group">
                <label data-i18n="s4_watermark" data-i18n-tip="s4_watermark_tip">Marca de Agua Táctica <span title="Protect your work by injecting embedded text." style="cursor:help;opacity:0.6"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-left: 2px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></span></label>
                <input type="text" id="watermarkInput" data-i18n="wm_placeholder" placeholder="@usuario o Firma" disabled style="margin-bottom: 5px;">
                
                <div style="display: flex; gap: 5px; margin-bottom: 5px;">
                    <select id="wmPos" style="flex: 1; padding: 4px;" disabled>
                        <option value="br" data-i18n="pos_br">Abajo Derecha</option>
                        <option value="bl" data-i18n="pos_bl">Abajo Izquierda</option>
                        <option value="tr" data-i18n="pos_tr">Arriba Derecha</option>
                        <option value="tl" data-i18n="pos_tl">Arriba Izquierda</option>
                        <option value="c" data-i18n="pos_c">Centro</option>
                    </select>
                    <input type="color" id="wmColor" value="#ffffff" title="Color de Texto" disabled style="width: 35px; padding: 0; cursor: pointer;">
                    <input type="color" id="wmBorderColor" value="#000000" title="Color de Borde" disabled style="width: 35px; padding: 0; cursor: pointer;">
                </div>
                
                <div style="display: flex; gap: 5px; align-items: center; font-size: 0.8em; flex-wrap: wrap; justify-content: space-between;">
                    <div style="display: flex; gap: 2px; flex: 1; min-width: 50px;">
                        <button id="wmBold" class="toggle-btn" disabled style="padding: 4px; flex: 1;">B</button>
                        <button id="wmItalic" class="toggle-btn" disabled style="padding: 4px; flex: 1; font-style: italic;">I</button>
                    </div>
                    
                    <div style="display: flex; align-items: center; flex: 2; min-width: 90px;">
                        <span style="margin-right: 5px;" data-i18n="s4_border_width_abbr" data-i18n-tip-only="s4_border_width_tip" title="Grosor Borde">Brd:</span>
                        <input type="range" id="wmBorderWidth" min="0" max="10" value="4" disabled style="width: 100%;">
                    </div>
                    
                    <div style="display: flex; align-items: center; flex: 2; min-width: 90px;">
                        <span style="margin-right: 5px;" data-i18n="s4_opacity_abbr" data-i18n-tip-only="s4_opacity_tip" title="Opacidad">Opc:</span>
                        <input type="range" id="wmOpacity" min="0.1" max="1" step="0.1" value="0.8" disabled style="width: 100%;">
                    </div>
                </div>
            </div>
            </div>
            <div class="section-card" style="margin-bottom: 0;">
                <div class="section-title" style="color: var(--accent-color);" data-i18n="s5_title">💾 5. Exportación</div>
                
                <div class="control-group" style="margin-bottom: 10px;">
                    <label data-i18n="s5_filename" data-i18n-tip="s5_filename_tip">Nombre del Archivo <span title="The name under which your final GIF or Video will be saved on your computer." style="cursor:help;opacity:0.6"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-left: 2px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></span></label>
                    <input type="text" id="filenameInput" placeholder="jitterfx_export" disabled>
                </div>
                
                <div class="control-group">
                    <label data-i18n="s5_resolution" data-i18n-tip="s5_resolution_tip">Resolución de Salida <span title="Scales the image before encoding the video. Prevents RAM crashes on giant canvases (4K+) and bypasses Twitter limits." style="cursor:help;opacity:0.6"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-left: 2px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></span></label>
                <div style="display: flex; gap: 5px; align-items: center;">
                    <select id="resolutionInput" style="flex: 1;" disabled>
                        <option value="3" data-i18n="res_3">x3 (Gigante)</option>
                        <option value="2" data-i18n="res_2">x2 (Doble)</option>
                        <option value="1.5" data-i18n="res_15">x1.5 (Aumentado)</option>
                        <option value="1" selected data-i18n="res_1">x1 (Original)</option>
                        <option value="0.75" data-i18n="res_075">x0.75 (Reducido)</option>
                        <option value="0.5" data-i18n="res_05">x0.5 (Mitad)</option>
                        <option value="0.25" data-i18n="res_025">x0.25 (Pequeño)</option>
                    </select>
                    <span id="resOutputLabel" style="font-size: 0.85em; opacity: 0.9; min-width: 85px; text-align: right; color: var(--accent-color);">-- x --</span>
                </div>
            </div>

            <div id="exportEstimate" style="font-size: 0.85em; opacity: 0.8; text-align: center; margin-bottom: 8px; color: var(--accent-color);"></div>

            <div class="control-group" style="flex-direction: row; gap: 10px;">
                <button id="exportBtn" disabled style="flex: 1;" data-i18n="btn_gif">Exportar GIF</button>
                <button id="exportWebmBtn" disabled style="flex: 1; background: #3cb4b3;" data-i18n="btn_webm">Exportar Video</button>
            </div>
            
            </div>
            
            <div id="status" data-i18n="status_waiting">Esperando imagen...</div>
        </aside>
        
        <main class="preview" id="dropZone">
            
        
<label class="theme-switch" data-i18n-tip-only="theme_toggle" title="Tema Fondo" style="position: absolute; top: 15px; right: 15px; z-index: 10;">
                <input type="checkbox" id="themeTogglePreview">
                <span class="slider round">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </span>
            </label>
