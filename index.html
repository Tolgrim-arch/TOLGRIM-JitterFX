<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>JitterFX - TOLGRIM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>JitterFX</h2>
            <div class="control-group">
                <label>Imagen (PNG/JPG/WEBP)</label>
                <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp">
            </div>
            
            <div class="control-group">
                <label>Tipo de Jitter</label>
                <select id="typeInput">
                    <option value="0">Global Shift</option>
                    <option value="1">Chunky Jitter (Bloques)</option>
                    <option value="2">Static / Fuzzy</option>
                    <option value="3">Mesh Bend (Ondulación)</option>
                    <option value="4">Smooth Chunky (Value Noise)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Intensidad: <span id="amountVal">0.005</span></label>
                <input type="range" id="amountInput" min="0" max="0.05" step="0.001" value="0.005">
            </div>

            <div class="control-group">
                <label>Velocidad (FPS): <span id="speedVal">8</span></label>
                <input type="range" id="speedInput" min="1" max="30" step="1" value="8">
            </div>

            <div class="control-group">
                <label>Frames Únicos: <span id="framesVal">3</span></label>
                <input type="range" id="framesInput" min="2" max="24" step="1" value="3">
            </div>

            <div class="control-group">
                <label>Tamaño Bloque (Chunky): <span id="blockVal">20</span></label>
                <input type="range" id="blockInput" min="1" max="100" step="1" value="20">
            </div>

            <div class="control-group" style="flex-direction: row; gap: 10px;">
                <button id="exportBtn" disabled style="flex: 1;">Exportar GIF</button>
                <button id="exportWebmBtn" disabled style="flex: 1; background: #03dac6;">Exportar WebM</button>
            </div>
            <div id="status">Esperando imagen...</div>
        </aside>
        
        <main class="preview">
            <canvas id="canvas"></canvas>
        </main>
    </div>
    
    <!-- gif.js for encoding -->
    <script src="gif.js"></script>
    <script src="app.js"></script>
</body>
</html>
